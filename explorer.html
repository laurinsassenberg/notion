<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Projects-Ordner öffnen</title>
<script>
  // Sofort unsichtbar, wenn automatisches Schließen eingeschaltet ist (vor dem ersten Zeichnen).
  try { if (localStorage.getItem("projects-link-autoclose") === "1") document.documentElement.style.visibility = "hidden"; } catch (e) {}
</script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
    background: #f7f6f3; color: #37352f;
  }
  @media (prefers-color-scheme: dark) { body { background: #191919; color: #e6e6e4; } }
  main { max-width: 30rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; }
  code { font: .95em ui-monospace, Consolas, monospace; }
  .muted { opacity: .7; font-size: .9rem; }
  button {
    font: inherit; margin: .75rem .25rem 0; padding: .5rem 1rem;
    border: 1px solid currentColor; border-radius: .4rem;
    background: transparent; color: inherit; cursor: pointer;
  }
  button:hover { opacity: .75; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Projects-Ordner</h1>
  <p id="msg"></p>
  <p>
    <button id="again" hidden>Ordner öffnen</button>
    <button id="auto" hidden>Künftig automatisch schließen</button>
  </p>
  <p id="hint" class="muted" hidden>
    Beim ersten Mal fragt der Browser, ob er den Link öffnen darf.
    Dort „Immer zulassen“ anhaken und bestätigen. Öffnet sich der Ordner,
    kann dieser Tab sich künftig von selbst schließen.
  </p>
</main>
<script>
// Weiterleitung von einem https-Link (z. B. aus Notion) auf das lokale Link-Schema "projects:".
// Aufruf: explorer.html#PJ-08562  oder  explorer.html#PJ-08562/PJ-08562-rp01
// Die Angabe hinter dem # verlässt den Browser nicht. Die Seite enthält keine Daten;
// ob und welcher Ordner sich öffnet, entscheidet allein das Skript auf dem eigenen Rechner.
(function () {
  var KEY = "projects-link-autoclose";
  var msg = document.getElementById("msg");
  var again = document.getElementById("again");
  var auto = document.getElementById("auto");
  var hint = document.getElementById("hint");

  function target(hash) {
    var raw = hash.replace(/^#/, "");
    try { raw = decodeURIComponent(raw); } catch (e) {}
    var m = /^(PJ-\d{5})(?:\/(PJ-\d{5}-rp\d{2}))?$/i.exec(raw);
    if (!m) return null;
    var pid = m[1].toUpperCase();
    if (!m[2]) return { label: pid, url: "projects://open/" + pid };
    var rid = m[2].toUpperCase().replace("-RP", "-rp");
    if (rid.indexOf(pid + "-rp") !== 0) return null;
    return { label: rid, url: "projects://open/" + pid + "/" + rid };
  }

  function autoclose() {
    try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; }
  }

  var t = target(location.hash);
  if (!t) {
    msg.textContent = "Kein gültiger Ordner angegeben. Erwartet wird z. B. #PJ-08562 oder #PJ-08562/PJ-08562-rp01.";
    return;
  }

  document.title = t.label + " öffnen";
  msg.innerHTML = "<code></code> wird im Explorer geöffnet.";
  msg.firstChild.textContent = t.label;

  function launch() { location.href = t.url; }

  again.hidden = false;
  again.addEventListener("click", launch);

  if (autoclose()) {
    launch();
    setTimeout(function () {
      window.close();
      document.documentElement.style.visibility = "visible";
    }, 400);
  } else {
    hint.hidden = false;
    auto.hidden = false;
    auto.addEventListener("click", function () {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      window.close();
    });
    launch();
  }
})();
</script>
</body>
</html>
